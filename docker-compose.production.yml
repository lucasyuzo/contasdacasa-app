# Credenciais de DB_USER/DB_PASSWORD (usadas na interpolacao ${...} abaixo) vem
# do .env na raiz deste arquivo (ticket 13, so na VPS), carregado automaticamente
# pelo Docker Compose CLI. DB_URL/DB_USER/DB_PASSWORD do app tambem vem de la
# via env_file.
services:
  app:
    image: ghcr.io/lucasyuzo/contasdacasa-app:latest
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: production
      JAVA_OPTS: -Xmx768m
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 1024m
    networks:
      - production-net

  db:
    image: postgres:17
    container_name: contasdacasa-production-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: contasdacasa
    volumes:
      - production-db-data:/var/lib/postgresql/data
    mem_limit: 512m
    networks:
      - production-net

networks:
  production-net:
    driver: bridge

volumes:
  production-db-data:
