name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      # Testes de integracao usam Testcontainers (Docker), disponivel por padrao no runner ubuntu-latest
      - name: Run tests
        run: ./mvnw -B test
